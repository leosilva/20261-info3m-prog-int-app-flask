{% extends "base.html" %}

{% block titulo %}Listagem de Usuário{% endblock %}

{% block conteudo %}
    <div class="card shadow mb-4 my-5">
        <div class="card-header py-3">
            <h1 class="h5 m-0 font-weight-bold text-primary">Listagem de Usuário</h1>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead>
                        <tr>
                            <th>Nome de Usuário</th>
                            <th>E-mail</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for usuario in usuarios %}
                        <tr>
                            <td>{{ usuario.username }}</td>
                            <td>{{ usuario.email }}</td>
                            <td>
                                <a href="{{ url_for('editar', id=usuario.id) }}">
                                    <i class="fa fa-light fa-pen"></i>
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
{% endblock %}
