<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>{% block titulo %}{% endblock %}</title>
        <!-- Custom fonts for this template-->
        <link href="{{ url_for('static', filename='css/font-awesome/all.min.css') }}" rel="stylesheet" type="text/css">
        <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">

        <!-- Custom styles for this template-->
        <link href="{{ url_for('static', filename='css/sb-admin-2.min.css') }}" rel="stylesheet">
        <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
    </head>
    <body id="page-top">
        <!-- Page Wrapper -->
        <div id="wrapper">
            {% include "shared/sidebar.html" %}
            <!-- Content Wrapper -->
            <div id="content-wrapper" class="d-flex flex-column">
                {% include "shared/messages.html" %}
                <!-- Main Content -->
                <div id="content">
                    {% include "shared/topbar.html" %}
                    <!-- Begin Page Content -->
                    <div class="container-fluid">
                        {% block conteudo %}
                        {% endblock %}
                    </div>
                    <!-- /.container-fluid -->
                </div>
                <!-- End of Main Content -->
                
                {% include "shared/footer.html" %}
            </div>
            <!-- End of Content Wrapper -->
        </div>
        <!-- End of Page Wrapper -->

        <!-- Scroll to Top Button-->
        <a class="scroll-to-top rounded" href="#page-top">
            <i class="fas fa-angle-up"></i>
        </a>

        {% include "shared/logout_modal.html" %}

        <!-- Bootstrap core JavaScript-->
        <script src="{{ url_for('static', filename='js/jquery/jquery.min.js') }}"></script>
        <script src="{{ url_for('static', filename='js/bootstrap/bootstrap.bundle.min.js') }}"></script>

        <!-- Core plugin JavaScript-->
        <script src="{{ url_for('static', filename='js/jquery-easing/jquery.easing.min.js') }}"></script>

        <!-- Custom scripts for all pages-->
        <script src="{{ url_for('static', filename='js/sb-admin-2.min.js') }}"></script>

        <!-- Page level plugins -->
        <script src="{{ url_for('static', filename='js/chartjs/Chart.min.js') }}"></script>

        <!-- Page level custom scripts -->
        <script src="{{ url_for('static', filename='js/demo/chart-area-demo.js') }}"></script>
        <script src="{{ url_for('static', filename='js/demo/chart-pie-demo.js') }}"></script>
    </body>
</html>
